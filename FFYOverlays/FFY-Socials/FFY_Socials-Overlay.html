<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FFY_Socials Overlay</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; padding: 48px; perspective: 1400px; }
  #wrap { transform: scale(var(--scale)); transform-origin: var(--origin); }
  #card { display: flex; align-items: center; gap: 18px; width: max-content; min-width: 200px; max-width: 760px; padding: 16px 28px 16px 16px;
    border-radius: var(--radius); background: var(--background); color: var(--text); font-family: var(--font);
    box-shadow: 0 10px 34px rgba(0, 0, 0, .45); visibility: hidden; }
  #card.edge { border-left: 8px solid var(--accent); }
  #card.on { visibility: visible; }
  #card.floating { padding: 0; border-left: 0; background: transparent; box-shadow: none; text-shadow: 0 2px 6px rgba(0, 0, 0, .85), 0 0 2px rgba(0, 0, 0, .9); }
  #card.floating #badge, #card.floating #picture { box-shadow: 0 3px 12px rgba(0, 0, 0, .55); }
  #badge { flex: none; display: flex; align-items: center; justify-content: center; width: var(--icon); height: var(--icon); background: var(--accent); color: var(--icon-ink); border-radius: var(--badge-radius); }
  #badge svg { width: 62%; height: 62%; fill: currentColor; }
  #initial { font-size: calc(var(--icon) * .55); font-weight: 800; line-height: 1; }
  #picture { flex: none; display: block; height: var(--icon); width: auto; max-width: calc(var(--icon) * 3.5); border-radius: var(--badge-radius); }
  #words { min-width: 0; }
  #name { color: var(--name); font-size: 34px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
  #text { margin-top: 3px; font-size: 25px; line-height: 1.25; overflow-wrap: anywhere; }
  .hidden { display: none !important; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slide-left { from { opacity: 0; transform: translateX(-120%); } to { opacity: 1; transform: none; } }
  @keyframes slide-right { from { opacity: 0; transform: translateX(120%); } to { opacity: 1; transform: none; } }
  @keyframes slide-top { from { opacity: 0; transform: translateY(-160%); } to { opacity: 1; transform: none; } }
  @keyframes slide-bottom { from { opacity: 0; transform: translateY(160%); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.5); } 70% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: none; } }
  @keyframes zoom { from { opacity: 0; transform: scale(1.8); } to { opacity: 1; transform: none; } }
  @keyframes flip { from { opacity: 0; transform: rotateX(90deg); } to { opacity: 1; transform: none; } }
  @keyframes bounce { 0% { opacity: 0; transform: translateY(-140%); } 55% { opacity: 1; transform: translateY(0); } 72% { transform: translateY(-16%); } 88% { transform: translateY(0); } 94% { transform: translateY(-5%); } 100% { opacity: 1; transform: none; } }
  @keyframes spin { from { opacity: 0; transform: rotate(-200deg) scale(.2); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <div id="card">
      <div id="badge"><svg id="icon" viewBox="0 0 24 24" aria-hidden="true"><path id="iconPath"></path></svg><span id="initial"></span></div>
      <img id="picture" alt="">
      <div id="words">
        <div id="name"></div>
        <div id="text"></div>
      </div>
    </div>
  </div>
</div>

12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"};
const SETTINGS = {
  showIcon: true,
  showName: true,
  showText: true,
  useItemColours: true,
  edge: true,
  showBox: true,
  background: "#14161c",
  opacity: 92,
  accent: "#ff6b1a",
  nameColour: "#ffffff",
  textColour: "#d9dde6",
  font: "Segoe UI",
  badgeShape: "rounded",
  corners: 16,
  iconSize: 72,
  position: "bottom-left",
  size: 100,
  showSeconds: 10,
  gapSeconds: 30,
  roundMinutes: 0,
  order: "list",
  appear: "slide-left",
  disappear: "slide-left",
  speed: 0.6,
  items: [],
};

const FONTS = { "Segoe UI": '"Segoe UI", Arial, sans-serif', "Arial Black": '"Arial Black", Arial, sans-serif', "Impact": 'Impact, "Arial Black", sans-serif', "Georgia": 'Georgia, serif', "Trebuchet MS": '"Trebuchet MS", Arial, sans-serif', "Comic Sans MS": '"Comic Sans MS", cursive', "Consolas": 'Consolas, monospace' };
const ANIMATIONS = ["fade", "slide-left", "slide-right", "slide-top", "slide-bottom", "pop", "zoom", "flip", "bounce", "spin", "none"];
const SHAPES = { circle: "50%", rounded: "18%", square: "0" };
const VERTICAL = { top: "flex-start", middle: "center", bottom: "flex-end" };
const HORIZONTAL = { left: "flex-start", center: "center", right: "flex-end" };

const params = new URLSearchParams(location.search);
for (const key of Object.keys(SETTINGS)) {
  if (key === "items" || !params.has(key)) continue;
  const value = params.get(key);
  SETTINGS[key] = typeof SETTINGS[key] === "number" ? Number(value) : typeof SETTINGS[key] === "boolean" ? value !== "false" && value !== "0" : value;
}
try { SETTINGS.items = JSON.parse(params.get("items") || "[]"); } catch (e) { SETTINGS.items = []; }
const PREVIEW = params.has("preview");

const $ = (id) => document.getElementById(id);
const card = $("card");
const isColour = (value) => /^#[0-9a-f]{6}$/i.test(value || "");
const wait = (ms) => new Promise((done) => setTimeout(done, ms));
const number = (value, fallback, low, high) => { const n = Number(value); return Math.max(low, Math.min(high, Number.isFinite(n) ? n : fallback)); };
const speedMs = () => number(SETTINGS.speed, 0.6, 0.1, 5) * 1000;
const enabled = () => (Array.isArray(SETTINGS.items) ? SETTINGS.items : []).filter((item) => item && typeof item === "object" && item.on !== false);

function rgba(hex, percent) {
  const n = parseInt((isColour(hex) ? hex : "#14161c").slice(1), 16);
  return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + number(percent, 92, 0, 100) / 100 + ")";
}

function inkOn(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 160 ? "#101010" : "#ffffff";
}

function applySettings() {
  const s = SETTINGS, root = document.documentElement.style;
  const [v, h] = String(s.position).split("-");
  const across = HORIZONTAL[h] ? h : "left", down = VERTICAL[v] ? v : "bottom";
  $("stage").style.alignItems = VERTICAL[down];
  $("stage").style.justifyContent = HORIZONTAL[across];
  root.setProperty("--origin", (down === "middle" ? "center" : down) + " " + across);
  root.setProperty("--scale", number(s.size, 100, 10, 400) / 100);
  root.setProperty("--background", rgba(s.background, s.opacity));
  root.setProperty("--name", isColour(s.nameColour) ? s.nameColour : "#ffffff");
  root.setProperty("--text", isColour(s.textColour) ? s.textColour : "#d9dde6");
  root.setProperty("--font", FONTS[s.font] || FONTS["Segoe UI"]);
  root.setProperty("--radius", number(s.corners, 16, 0, 200) + "px");
  root.setProperty("--badge-radius", SHAPES[s.badgeShape] || SHAPES.rounded);
  root.setProperty("--icon", number(s.iconSize, 72, 16, 400) + "px");
  card.classList.toggle("edge", !!s.edge);
  card.classList.toggle("floating", !s.showBox);
}

function imageUrl(value) {
  if (/^https?:\/\//i.test(value)) return value;
  return value.split("/").map(encodeURIComponent).join("/");
}

function showBadge(item) {
  const path = ICONS[item.platform];
  $("picture").classList.add("hidden");
  $("badge").classList.toggle("hidden", !SETTINGS.showIcon);
  $("icon").classList.toggle("hidden", !path);
  $("initial").classList.toggle("hidden", !!path);
  if (path) $("iconPath").setAttribute("d", path);
  else $("initial").textContent = String(item.name || "?").charAt(0).toUpperCase();
}

function loadPicture(item) {
  const picture = $("picture");
  picture.onload = picture.onerror = null;
  picture.removeAttribute("src");
  showBadge(item);
  if (!item.image || !SETTINGS.showIcon) return Promise.resolve();
  return new Promise((done) => {
    const timer = setTimeout(done, 2500);
    picture.onload = () => { clearTimeout(timer); $("badge").classList.add("hidden"); picture.classList.remove("hidden"); done(); };
    picture.onerror = () => { clearTimeout(timer); done(); };
    picture.src = imageUrl(String(item.image));
  });
}

function fill(item) {
  const accent = SETTINGS.useItemColours && isColour(item.colour) ? item.colour : isColour(SETTINGS.accent) ? SETTINGS.accent : "#ff6b1a";
  card.style.setProperty("--accent", accent);
  card.style.setProperty("--icon-ink", inkOn(accent));
  $("name").textContent = item.name || "";
  $("text").textContent = item.text || "";
  $("name").classList.toggle("hidden", !SETTINGS.showName || !item.name);
  $("text").classList.toggle("hidden", !SETTINGS.showText || !item.text);
  return loadPicture(item);
}

function animate(name, leaving) {
  card.style.animation = "none";
  void card.offsetWidth;
  if (!ANIMATIONS.includes(name) || name === "none") { card.style.animation = ""; return 0; }
  card.style.animation = name + " " + speedMs() + "ms ease-out both " + (leaving ? "reverse" : "normal");
  return speedMs();
}

async function appear(item) {
  await fill(item);
  card.classList.add("on");
  await wait(animate(SETTINGS.appear, false));
}

async function disappear() {
  await wait(animate(SETTINGS.disappear, true));
  card.classList.remove("on");
  card.style.animation = "";
}

let run = 0, lastShown = null;

function shuffled(list) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  if (out.length > 1 && out[0] === lastShown) out.push(out.shift());
  return out;
}

async function rotate(once) {
  const token = ++run;
  const alive = () => token === run;
  do {
    const list = SETTINGS.order === "shuffle" ? shuffled(enabled()) : enabled();
    if (!list.length) return true;
    for (const item of list) {
      lastShown = item;
      await appear(item);
      if (!alive()) return;
      const seconds = number(SETTINGS.showSeconds, 10, 1, 86400);
      await wait((once ? Math.min(seconds, 2.5) : seconds) * 1000);
      if (!alive()) return;
      await disappear();
      if (!alive()) return;
      const gap = number(SETTINGS.gapSeconds, 30, 0, 86400);
      await wait((once ? Math.min(gap, 0.4) : gap) * 1000);
      if (!alive()) return;
    }
    const rest = number(SETTINGS.roundMinutes, 0, 0, 1440);
    if (rest > 0 && !once) await wait(rest * 60000);
    if (!alive()) return;
  } while (!once);
  return true;
}

let focus = 0;

function focusedItem() {
  const items = Array.isArray(SETTINGS.items) ? SETTINGS.items : [];
  return items[focus] || enabled()[0] || null;
}

async function hold() {
  run++;
  const item = focusedItem();
  card.style.animation = "";
  if (!item) { card.classList.remove("on"); return; }
  await fill(item);
  card.classList.add("on");
}

async function replay() {
  const token = ++run;
  const item = focusedItem();
  if (!item) return;
  await disappear();
  await wait(250);
  if (token !== run) return;
  await appear(item);
}

applySettings();
if (PREVIEW) {
  window.addEventListener("message", async (e) => {
    const d = e.data;
    if (!d || !d.ffySocials) return;
    if (d.settings) { Object.assign(SETTINGS, d.settings); applySettings(); }
    if (typeof d.focus === "number") focus = d.focus;
    if (d.ffySocials === "settings") hold();
    if (d.ffySocials === "animate") replay();
    if (d.ffySocials === "play" && await rotate(true)) hold();
  });
  hold();
} else {
  rotate(false);
}
</script>
