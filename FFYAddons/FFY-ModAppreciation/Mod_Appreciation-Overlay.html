<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mod_Appreciation Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; padding: 48px; }
  #wrap { transform: scale(var(--scale)); transform-origin: var(--origin); }
  #card { width: 850px; padding: 30px 42px; border-radius: var(--radius); border: 6px solid var(--edge); background: var(--background); color: var(--text); font-family: var(--font);
    box-shadow: 0 18px 45px rgba(0, 0, 0, .55), 0 0 45px color-mix(in srgb, var(--accent) 35%, transparent); visibility: hidden; }
  #card.on { visibility: visible; }
  #card.wide { width: 1425px; }
  #card.hero { width: 760px; padding: 26px 30px 20px; }
  #head { display: flex; align-items: center; gap: 22px; }
  #titles { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #title { color: var(--name); font: 78px/1 var(--font-head); letter-spacing: 2px; text-shadow: 0 4px 0 rgba(0, 0, 0, .45); overflow-wrap: anywhere; }
  #heroName { order: -1; color: var(--name); font: 60px/1 var(--font-head); letter-spacing: 2px; overflow-wrap: anywhere; }
  #card.hero #title { margin-top: 6px; color: var(--accent); font: 900 21px/1.2 var(--font); letter-spacing: 3px; text-shadow: none; text-transform: uppercase; }
  #subtitle { margin-top: 5px; font-size: 24px; font-weight: 800; line-height: 1.25; opacity: .8; overflow-wrap: anywhere; }
  #empty { margin: 34px 0 24px; font-size: 34px; font-weight: 900; text-align: center; opacity: .8; }
  #rows { display: grid; gap: 8px; margin-top: 20px; }
  #card.two #rows { grid-auto-flow: column; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 34px; }
  .row { display: flex; align-items: center; gap: 15px; min-height: 62px; padding: 7px 18px 7px 9px; border-radius: 15px; background: rgba(255, 255, 255, .06); font-size: 27px; font-weight: 800; }
  .rank { flex: none; display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, .12); font-size: 22px; font-weight: 900; }
  .r1 .rank { background: var(--gold); color: #1a1200; box-shadow: 0 0 14px var(--gold); }
  .r2 .rank { background: var(--silver); color: #14171b; }
  .r3 .rank { background: var(--bronze); color: #1b0f05; }
  .k-top .r1 { background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 28%, transparent), rgba(255, 255, 255, .06) 70%); }
  .k-top .r2 { background: linear-gradient(90deg, color-mix(in srgb, var(--silver) 22%, transparent), rgba(255, 255, 255, .06) 70%); }
  .k-top .r3 { background: linear-gradient(90deg, color-mix(in srgb, var(--bronze) 22%, transparent), rgba(255, 255, 255, .06) 70%); }
  .who { flex: 1; min-width: 0; }
  .name { color: var(--name); line-height: 1.15; overflow-wrap: anywhere; }
  .label { margin-top: 2px; font-size: 18px; line-height: 1.2; opacity: .8; overflow-wrap: anywhere; }
  .value { flex: none; max-width: 50%; color: var(--accent); font-weight: 900; text-align: right; overflow-wrap: anywhere; }
  .value small { color: var(--text); font-size: .66em; opacity: .7; }
  .k-rank .name { color: var(--accent); font-size: 21px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
  .k-rank .row { min-height: 74px; }
  .k-rank .rank { width: 56px; height: 56px; }
  .picture { position: relative; flex: none; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border: 2px solid rgba(255, 255, 255, .6); border-radius: var(--picture-radius);
    background: #000; color: var(--accent); font-size: 22px; font-weight: 900; }
  .picture img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #heroPicture { width: 112px; height: 112px; border: 5px solid var(--accent); font-size: 52px; }
  #card.k-champs:not(.hero) #rows { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 34px; margin-top: 26px; }
  .champ { position: relative; gap: 24px; min-height: 165px; padding: 14px 28px; border: 3px solid color-mix(in srgb, var(--gold) 60%, transparent); border-radius: 22px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 22%, transparent), rgba(255, 255, 255, .06) 75%); }
  .champ .picture { width: 118px; height: 118px; border: 5px solid var(--gold); box-shadow: 0 0 22px var(--gold); color: var(--gold); font-size: 56px; }
  .champ .crown { position: absolute; left: 62px; top: -22px; width: 74px; height: 43px; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .55)); }
  .picture.hidden + .crown { left: 22px; }
  .champ .label { margin: 0; color: var(--accent); font-size: 20px; font-weight: 900; letter-spacing: 3px; opacity: 1; text-transform: uppercase; }
  .champ .name { margin: 4px 0; font: 56px/1.05 var(--font-head); letter-spacing: 1px; }
  .champ .value { max-width: none; color: var(--gold); font-size: 32px; text-align: left; }
  .champ.nobody { opacity: .55; }
  .champ.nobody .name { font-size: 38px; }
  .hidden { display: none !important; }
  .slide.in { animation: slideIn .55s cubic-bezier(.2, .9, .25, 1.05) both; }
  .slide.out { animation: slideOut .4s ease-in both; }
  .pop.in { animation: popIn .5s cubic-bezier(.2, 1.3, .4, 1) both; }
  .pop.out { animation: popOut .3s ease-in both; }
  .fade.in { animation: fadeIn .5s ease-out both; }
  .fade.out { animation: fadeOut .4s ease-in both; }
  #card.in .row { animation: rowIn .35s ease-out both; animation-delay: calc(.2s + var(--i) * 70ms); }
  @keyframes rowIn { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translate(var(--from-x), var(--from-y)); } to { opacity: 1; transform: none; } }
  @keyframes slideOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate(var(--from-x), var(--from-y)); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes popOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.8); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  #status { position: fixed; left: 12px; bottom: 10px; padding: 5px 9px; border-radius: 6px; background: rgba(0, 0, 0, .75); color: #ffb4a0; font: 14px "Segoe UI", Arial, sans-serif; }
  #status:empty { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <div id="card">
      <div id="head"><div class="picture" id="heroPicture"></div><div id="titles"><div id="title"></div><div id="heroName"></div><div id="subtitle"></div></div></div>
      <div id="empty">No data yet</div>
      <div id="rows"></div>
    </div>
  </div>
</div>
<div id="status"></div>
<script>
const SETTINGS = {
  host: "127.0.0.1",
  port: 8080,
  endpoint: "/",
  password: "",
  showChamps: true,
  showTop: true,
  showRank: true,
  showRecap: true,
  showThanks: true,
  showAppreciate: true,
  showMilestone: true,
  showMvp: true,
  showPictures: true,
  background: "#1d1d1f",
  backgroundTo: "",
  opacity: 100,
  edge: "",
  accent: "#3ddc97",
  nameColour: "#ffffff",
  textColour: "#ffffff",
  headFont: "Bangers",
  font: "Nunito",
  pictureShape: "circle",
  corners: 32,
  position: "middle-center",
  size: 100,
  seconds: 10,
  animation: "slide",
};

const KINDS = { champs: "showChamps", top: "showTop", rank: "showRank", recap: "showRecap", thanks: "showThanks", appreciate: "showAppreciate", milestone: "showMilestone", mvp: "showMvp" };
const FONTS = { "Bangers": 'Bangers, Impact, sans-serif', "Nunito": 'Nunito, "Segoe UI", sans-serif', "Segoe UI": '"Segoe UI", Arial, sans-serif', "Arial Black": '"Arial Black", Arial, sans-serif', "Impact": 'Impact, "Arial Black", sans-serif', "Georgia": 'Georgia, serif', "Trebuchet MS": '"Trebuchet MS", Arial, sans-serif', "Comic Sans MS": '"Comic Sans MS", cursive', "Consolas": 'Consolas, monospace' };
const NO_DATA = ["champs", "top", "rank", "recap"];
const ALWAYS_SHOW = ["milestone", "mvp"];
const MAX_WAITING = 3;
const RUSH_SECONDS = 4;
const CROWN = '<svg class="crown" viewBox="0 0 100 58"><path d="M10 46 L18 12 L34 30 L50 6 L66 30 L82 12 L90 46 Z" fill="#ffc83d" stroke="#2a1a00" stroke-width="2.5" stroke-linejoin="round"/><rect x="9" y="42" width="82" height="13" rx="4" fill="#ffd877" stroke="#2a1a00" stroke-width="2.5"/><circle cx="18" cy="12" r="4.5" fill="#e8332a"/><circle cx="50" cy="6" r="5.5" fill="#3cb4ff"/><circle cx="82" cy="12" r="4.5" fill="#e8332a"/><circle cx="30" cy="48.5" r="3" fill="#3cb4ff"/><circle cx="50" cy="48.5" r="3.5" fill="#e8332a"/><circle cx="70" cy="48.5" r="3" fill="#3cb4ff"/></svg>';
const ANIMATIONS = ["slide", "pop", "fade"];
const SHAPES = { circle: "50%", rounded: "18%", square: "0" };
const VERTICAL = { top: "flex-start", middle: "center", bottom: "flex-end" };
const HORIZONTAL = { left: "flex-start", center: "center", right: "flex-end" };
const row = (name, label, value) => ({ name, label, value, picture: "" });
const SAMPLES = {
  champs: { kind: "champs", title: "Mod Champs", subtitle: "Number one on every board", rows: [row("MossyMod", "Watch Streak", "104 streams"), row("KindKeeper", "Sub Streak", "36 months"), row("Banhammer_Bea", "Gifted Subs", "120 subs"), row("KindKeeper", "Bits", "25,000 bits"), row("MossyMod", "Most Thanked", "67 thanks"), row("Banhammer_Bea", "Chat Guard", "118 timeouts and bans"), row("MossyMod", "Mod of the Stream", "12 wins"), row("", "Streams Modded", "")] },
  top: { kind: "top", title: "Top Mods: Watch Streak", rows: [row("MossyMod", "#1", "42 streams"), row("KindKeeper", "#2", "31 streams"), row("Banhammer_Bea", "#3", "18 streams")] },
  rank: { kind: "rank", title: "Mod Stats", hero: "MossyMod", rows: [row("Watch Streak", "#1", "42 streams"), row("Most Thanked", "#2", "51 thanks"), row("Chat Guard", "#3", "24 timeouts and bans")] },
  recap: { kind: "recap", title: "This Stream's Mods", subtitle: "Mod of the Stream: MossyMod", rows: [row("MossyMod", "212 messages, 6 timeouts and bans", "9 thanks"), row("KindKeeper", "120 messages, 2 timeouts and bans", "4 thanks")] },
  thanks: { kind: "thanks", title: "Mod Appreciation", subtitle: "Sam says thank you!", hero: "MossyMod", rows: [] },
  appreciate: { kind: "appreciate", title: "Mod Appreciation", subtitle: "This community wouldn't be the same without you.", hero: "MossyMod", rows: [] },
  milestone: { kind: "milestone", title: "50-Stream Watch Streak", subtitle: "Thank you for always being here", hero: "MossyMod", rows: [] },
  mvp: { kind: "mvp", title: "Mod of the Stream", subtitle: "Thank you for looking after chat today", hero: "MossyMod", rows: [row("MossyMod", "212 messages, 6 timeouts and bans", "9 thanks")] },
  empty: { kind: "champs", title: "Mod Champs", rows: [] },
};

const params = new URLSearchParams(location.search);
for (const key of Object.keys(SETTINGS)) {
  if (!params.has(key)) continue;
  const value = params.get(key);
  SETTINGS[key] = typeof SETTINGS[key] === "number" ? Number(value) : typeof SETTINGS[key] === "boolean" ? value !== "false" && value !== "0" : value;
}
const DEMO = params.get("demo");

const $ = (id) => document.getElementById(id);
const card = $("card");
const isColour = (value) => /^#[0-9a-f]{6}$/i.test(value || "");
const wait = (ms) => new Promise((done) => setTimeout(done, ms));
let current = null, animation = "slide", sample = "champs", rushing = false;

function rgba(hex, alpha) {
  const n = parseInt((isColour(hex) ? hex : "#14161c").slice(1), 16);
  return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + alpha + ")";
}

function applySettings() {
  const s = SETTINGS, root = document.documentElement.style;
  const [v, h] = String(s.position).split("-");
  const across = HORIZONTAL[h] ? h : "left", down = VERTICAL[v] ? v : "bottom";
  const accent = isColour(s.accent) ? s.accent : "#3ddc97";
  const text = isColour(s.textColour) ? s.textColour : "#d9dde6";
  $("stage").style.alignItems = VERTICAL[down];
  $("stage").style.justifyContent = HORIZONTAL[across];
  root.setProperty("--origin", (down === "middle" ? "center" : down) + " " + across);
  root.setProperty("--from-x", across === "left" ? "-120%" : across === "right" ? "120%" : "0");
  root.setProperty("--from-y", across !== "center" ? "0" : down === "top" ? "-160%" : "160%");
  root.setProperty("--scale", Math.max(10, Number(s.size) || 100) / 100);
  const solid = Math.max(0, Math.min(100, Number(s.opacity))) / 100;
  root.setProperty("--background", "linear-gradient(160deg, " + rgba(s.background, solid) + ", " + rgba(isColour(s.backgroundTo) ? s.backgroundTo : s.background, solid) + ")");
  root.setProperty("--edge", isColour(s.edge) ? s.edge : accent);
  root.setProperty("--accent", accent);
  root.setProperty("--gold", "#ffc83d");
  root.setProperty("--silver", "#d7dde5");
  root.setProperty("--bronze", "#d08a4a");
  root.setProperty("--name", isColour(s.nameColour) ? s.nameColour : "#ffffff");
  root.setProperty("--text", text);
  root.setProperty("--font", FONTS[s.font] || FONTS["Nunito"]);
  root.setProperty("--font-head", FONTS[s.headFont] || FONTS["Bangers"]);
  root.setProperty("--radius", Math.max(0, Number(s.corners) || 0) + "px");
  root.setProperty("--picture-radius", SHAPES[s.pictureShape] || SHAPES.circle);
  animation = ANIMATIONS.includes(s.animation) ? s.animation : "slide";
  if (current) fill(current);
}

function picture(box, name, url) {
  box.replaceChildren(String(name || "?").charAt(0).toUpperCase());
  box.classList.toggle("hidden", !SETTINGS.showPictures);
  if (!url || !SETTINGS.showPictures || !/^https?:\/\//i.test(url)) return;
  const image = new Image();
  image.alt = "";
  image.onload = () => box.append(image);
  image.src = url;
}

function valueBox(text) {
  const value = document.createElement("div");
  value.className = "value";
  const parts = /^(\S+)\s+(.+)$/.exec(text || "");
  if (parts) {
    const unit = document.createElement("small");
    unit.textContent = parts[2];
    value.append(parts[1] + " ", unit);
  } else value.textContent = text || "";
  return value;
}

function makeRow(r, kind, index) {
  const line = document.createElement("div");
  line.className = "row";
  line.style.setProperty("--i", index);
  const who = document.createElement("div");
  who.className = "who";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = r.name || (kind === "champs" ? "No data yet" : "");
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = r.label || "";
  if (kind === "champs") {
    line.classList.add("champ");
    line.classList.toggle("nobody", !r.name);
    const box = document.createElement("div");
    box.className = "picture";
    if (r.name) picture(box, r.name, r.picture);
    else { box.textContent = "?"; box.classList.toggle("hidden", !SETTINGS.showPictures); }
    line.append(box);
    if (r.name) line.insertAdjacentHTML("beforeend", CROWN);
    who.append(label, name);
    if (r.value) who.append(valueBox(r.value));
    line.append(who);
    return line;
  }
  who.append(name);
  if (kind === "top" || kind === "rank") {
    const place = parseInt(String(r.label || "").replace("#", ""), 10);
    const rank = document.createElement("div");
    rank.className = "rank";
    rank.textContent = kind === "top" ? (place || "") : r.label || "★";
    if (place >= 1 && place <= 3) line.classList.add("r" + place);
    line.append(rank);
  }
  if (kind !== "rank") {
    const box = document.createElement("div");
    box.className = "picture";
    picture(box, r.name, r.picture);
    line.append(box);
  }
  if (r.label && kind !== "top" && kind !== "rank") who.append(label);
  line.append(who);
  if (r.value) line.append(valueBox(r.value));
  return line;
}

function fill(d) {
  const rows = Array.isArray(d.rows) ? d.rows : [];
  const kind = String(d.kind || "");
  const two = kind !== "champs" && !d.hero && rows.length > 5;
  card.className = [...card.classList].filter((c) => ["on", "slide", "pop", "fade", "in", "out"].includes(c)).join(" ");
  card.classList.add("k-" + (kind || "card"));
  if (d.hero) card.classList.add("hero");
  else if (two) card.classList.add("wide", "two");
  else if (kind === "champs" && rows.length) card.classList.add("wide");
  $("title").textContent = d.title || "";
  $("subtitle").textContent = d.subtitle || "";
  $("subtitle").classList.toggle("hidden", !d.subtitle);
  $("heroName").textContent = d.hero || "";
  $("heroName").classList.toggle("hidden", !d.hero);
  $("heroPicture").classList.add("hidden");
  if (d.hero) picture($("heroPicture"), d.hero, d.heroPicture);
  $("empty").classList.toggle("hidden", rows.length > 0 || !NO_DATA.includes(kind));
  $("rows").classList.toggle("hidden", rows.length === 0);
  $("rows").style.gridTemplateRows = two ? "repeat(" + Math.ceil(rows.length / 2) + ", auto)" : "";
  $("rows").replaceChildren(...rows.map((r, i) => makeRow(r, kind, i)));
}

function setAnimation(step) {
  card.classList.remove("slide", "pop", "fade", "in", "out");
  void card.offsetWidth;
  if (step) card.classList.add(rushing ? "fade" : animation, step);
}

const queue = [];
let busy = false;

async function next() {
  if (busy) return;
  busy = true;
  while (queue.length) {
    current = queue.shift();
    rushing = queue.length > 0;
    fill(current);
    setAnimation("in");
    card.classList.add("on");
    const seconds = Math.max(1, Number(SETTINGS.seconds) || 10);
    await wait((rushing ? Math.min(seconds, RUSH_SECONDS) : seconds) * 1000);
    setAnimation("out");
    await wait(450);
    card.classList.remove("on");
    setAnimation("");
  }
  rushing = false;
  busy = false;
}

function handle(d) {
  if (!d || !d.modAppreciation) return;
  const key = KINDS[d.kind];
  if (key && !SETTINGS[key]) return;
  if (queue.length >= MAX_WAITING && !ALWAYS_SHOW.includes(d.kind)) return;
  queue.push(d);
  next();
}

let socket = null, helloTimer = 0;
function status(text) { $("status").textContent = text || ""; }
function send(message) { if (socket && socket.readyState === 1) socket.send(JSON.stringify(message)); }
function ready() {
  send({ request: "Subscribe", id: "mod-appreciation-sub", events: { General: ["Custom"] } });
  status("");
}
async function sha256(text) {
  const bytes = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return btoa(String.fromCharCode(...new Uint8Array(bytes)));
}
function connect() {
  const address = "ws://" + (SETTINGS.host === "0.0.0.0" ? "127.0.0.1" : SETTINGS.host) + ":" + SETTINGS.port + (SETTINGS.endpoint || "/");
  try { socket = new WebSocket(address); } catch (e) { status("Can't connect to " + address); setTimeout(connect, 5000); return; }
  status("Connecting to Streamer.bot at " + address + "...");
  socket.onopen = () => { helloTimer = setTimeout(ready, 1500); };
  socket.onmessage = async (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.op !== undefined && m.d) {
      clearTimeout(helloTimer);
      status("Port " + SETTINGS.port + " is OBS's WebSocket, not Streamer.bot's. Use the port from Streamer.bot: Servers/Clients > WebSocket Server (usually 8080).");
      socket.onclose = null; socket.close();
      return;
    }
    if (m.request === "Hello") {
      clearTimeout(helloTimer);
      if (m.authentication) {
        if (!SETTINGS.password) { status("Streamer.bot wants a password. Add it in Mod_Appreciation-Settings.html and copy the link again."); return; }
        const secret = await sha256(SETTINGS.password + m.authentication.salt);
        send({ request: "Authenticate", id: "mod-appreciation-auth", authentication: await sha256(secret + m.authentication.challenge) });
        return;
      }
      ready();
      return;
    }
    if (m.id === "mod-appreciation-auth") { if (m.status === "ok") ready(); else status("Streamer.bot said the password is wrong."); return; }
    if (m.event && m.event.source === "General" && m.event.type === "Custom") {
      let d = m.data;
      if (typeof d === "string") { try { d = JSON.parse(d); } catch { return; } }
      if (d && d.data && !d.modAppreciation) d = d.data;
      handle(d);
    }
  };
  socket.onclose = () => {
    clearTimeout(helloTimer);
    status("Can't reach Streamer.bot at " + address + ". Is its WebSocket Server running?");
    setTimeout(connect, 5000);
  };
}

function showSample() {
  current = SAMPLES[sample] || SAMPLES.champs;
  fill(current);
  setAnimation("");
  card.classList.add("on");
}

applySettings();
if (DEMO === "hold") {
  showSample();
  window.addEventListener("message", async (e) => {
    if (!e.data || !e.data.modPreview) return;
    Object.assign(SETTINGS, e.data.settings || {});
    if (e.data.sample) sample = e.data.sample;
    applySettings();
    showSample();
    if (e.data.modPreview === "play") {
      setAnimation("out");
      await wait(450);
      setAnimation("in");
    }
  });
} else if (DEMO) {
  const names = Object.keys(SAMPLES);
  let n = 0;
  const play = () => { handle(Object.assign({ modAppreciation: true }, SAMPLES[names[n % names.length]])); n++; };
  play();
  setInterval(play, (Math.max(1, Number(SETTINGS.seconds) || 10) + 2) * 1000);
} else connect();
</script>
</body>
</html>
