<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AutoVIP Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --loser-ring: #ff6b1a; --thief-ring: #ffffff; --name-tag: #141414; --name-tag-border: #ff6b1a; --name-text: #ffffff;
    --badge: #ff6b1a; --badge-shine: #ffa055; --banner-from: #ff7a1a; --banner-to: #e8332a; --banner-border: #141414;
    --banner-words: #ffffff; --streaks: #ff9646; --flash: #ffd6aa;
    --panel-from: #1d1d1f; --panel-to: #0b0b0c; --panel-border: #ff6b1a; --accent: #ff6b1a; --panel-text: #ffffff;
    --row-bg: rgba(255,255,255,.06); --gold: #ffc83d; --silver: #d7dde5; --bronze: #d08a4a;
    --font-head: "Bangers", "Impact", sans-serif; --font-text: "Nunito", sans-serif;
  }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body.preview { background: #2b2d36; }
  #stage { position: relative; width: 2560px; height: 1440px; transform-origin: top left; font-family: var(--font-text); }
  .who { position: absolute; left: 0; top: 0; width: 270px; text-align: center; opacity: 0; transform-origin: 135px 135px; will-change: transform, opacity; }
  .face { width: 270px; height: 270px; border-radius: 50%; border: 11px solid var(--thief-ring); box-shadow: 0 12px 30px rgba(0,0,0,.45); background: #141414 center/cover no-repeat;
    display: flex; align-items: center; justify-content: center; color: #fff; font: 900 120px var(--font-text); box-sizing: border-box; }
  .name { display: inline-block; margin-top: 16px; padding: 6px 22px; border-radius: 999px; background: var(--name-tag); color: var(--name-text); border: 4px solid var(--name-tag-border);
    font-size: 34px; font-weight: 900; max-width: 380px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
  #victim .face { border-color: var(--loser-ring); }
  #streaks { position: absolute; left: 0; top: 0; width: 420px; height: 270px; opacity: 0; pointer-events: none; will-change: transform, opacity;
    background: repeating-linear-gradient(180deg, transparent 0 28px, var(--streaks) 28px 34px, transparent 34px 52px);
    -webkit-mask: linear-gradient(90deg, transparent, #000 70%); mask: linear-gradient(90deg, transparent, #000 70%); }
  #badge { position: absolute; left: 0; top: 0; width: 100px; height: 100px; opacity: 0; transform-origin: 50px 50px; will-change: transform, opacity;
    filter: drop-shadow(0 0 10px var(--badge)) drop-shadow(0 0 24px var(--badge)); overflow: visible; }
  #flash { position: absolute; inset: 0; background: radial-gradient(circle at 1280px 670px, var(--flash), transparent 420px); opacity: 0; pointer-events: none; will-change: opacity; }
  #banner { position: absolute; left: 50%; top: 1000px; transform: translateX(-50%); min-width: 900px; max-width: 1900px; padding: 22px 44px; border-radius: 28px;
    background: linear-gradient(135deg, var(--banner-from), var(--banner-to)); color: var(--banner-words); text-align: center; border: 6px solid var(--banner-border);
    box-shadow: 0 10px 26px rgba(0,0,0,.45); opacity: 0; will-change: transform, opacity; }
  #banner .big { font: calc(72px * var(--hs, 1)) var(--font-head); letter-spacing: 1.5px; line-height: 1.1; text-shadow: 0 4px 0 var(--banner-border); -webkit-text-stroke: 2px var(--banner-border); }
  #banner .small { margin-top: 6px; font-size: 34px; font-weight: 800; opacity: .95; }

  .fx { position: absolute; left: 0; top: 0; width: 2560px; height: 1440px; pointer-events: none; display: none; }
  #stage.fxon .fx { display: block; }
  #stealWrap { position: absolute; left: 0; top: 0; width: 2560px; height: 1440px; transform-origin: 1280px 720px; pointer-events: none; }
  #boardWrap { position: absolute; left: 330px; top: 110px; width: 1900px; height: 1220px; transform-origin: top left; }
  #board { position: absolute; left: 0; top: 0; width: 1900px; height: 1220px; box-sizing: border-box; padding: 40px 56px; border-radius: 42px;
    background: linear-gradient(160deg, var(--panel-from), var(--panel-to)); border: 8px solid var(--panel-border); color: var(--panel-text);

  #board .bhead { display: flex; align-items: center; gap: 36px; height: 220px; }

  #board .bphoto.none { display: none; }
  #board .btitles { flex: 1; min-width: 0; }
  #board .bheader { font: 900 34px var(--font-text); letter-spacing: 6px; text-transform: uppercase; color: var(--accent); }
  #board .btitle { font: calc(104px * var(--hs, 1)) var(--font-head); letter-spacing: 3px; line-height: 1; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 6px 0 rgba(0,0,0,.45); }
  #board .bsub { font: 800 32px var(--font-text); opacity: .8; margin-top: 4px; }
  #board .bdots { display: flex; gap: 16px; align-self: flex-start; margin-top: 18px; }
  #board .bdots i { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.2); }
  #board .bdots i.on { background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  #board .bcols { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 0 var(--colgap, 46px); margin-top: 26px; }
  #board .row { display: flex; align-items: center; gap: calc(var(--rk, 58px) * .34); height: var(--rowh, 80px); margin-bottom: var(--rowgap, 10px); padding: 0 calc(var(--rk, 58px) * .38) 0 12px; border-radius: calc(var(--rowh, 80px) * .25); background: var(--row-bg);
    font: 800 var(--fs, 36px) var(--font-text); opacity: 0; will-change: transform, opacity; }
  #board .rank { flex: 0 0 var(--rk, 58px); height: var(--rk, 58px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 900 calc(var(--rk, 58px) * .5) var(--font-text);
    background: rgba(255,255,255,.12); color: var(--panel-text); }
  #board .row.r1 .rank { background: var(--gold); color: #1a1200; box-shadow: 0 0 18px var(--gold); }
  #board .row.r2 .rank { background: var(--silver); color: #14171b; }
  #board .row.r3 .rank { background: var(--bronze); color: #1b0f05; }
  #board .row.r1 { background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 28%, transparent), var(--row-bg) 70%); }
  #board .row.r2 { background: linear-gradient(90deg, color-mix(in srgb, var(--silver) 22%, transparent), var(--row-bg) 70%); }
  #board .row.r3 { background: linear-gradient(90deg, color-mix(in srgb, var(--bronze) 22%, transparent), var(--row-bg) 70%); }
  #board .pic { flex: 0 0 var(--rk, 58px); height: var(--rk, 58px); border-radius: 50%; background: #000 center/cover no-repeat; border: 3px solid rgba(255,255,255,.6); }
  #board .who2 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #board .val { flex: 0 0 auto; font-weight: 900; color: var(--accent); }
  #board .val small { font-size: calc(var(--fs, 36px) * .66); color: var(--panel-text); opacity: .7; margin-left: 6px; }
  #board .champs { grid-column: 1 / span 2; display: grid; grid-template-columns: 1fr 1fr; gap: 34px 46px; margin-top: 10px; }
  #board .champ { position: relative; display: flex; align-items: center; gap: 34px; height: 400px; padding: 0 40px; border-radius: 30px; box-sizing: border-box;
    background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 22%, transparent), var(--row-bg) 75%); border: 4px solid color-mix(in srgb, var(--gold) 60%, transparent); }
  #board .champ .cpic { flex: 0 0 230px; height: 230px; border-radius: 50%; border: 8px solid var(--gold); box-shadow: 0 0 34px var(--gold); background: #000 center/cover no-repeat;
    display: flex; align-items: center; justify-content: center; font: 900 110px var(--font-text); color: var(--gold); }
  #board .champ .crown { position: absolute; left: 88px; top: -30px; width: 100px; height: 58px; transform-origin: 50% 80%; filter: drop-shadow(0 0 7px color-mix(in srgb, var(--gold) 55%, transparent)) drop-shadow(0 4px 6px rgba(0,0,0,.55)); }
  #board .champ .cinfo { flex: 1; min-width: 0; }
  #board .champ .cboard { font: 900 30px var(--font-text); letter-spacing: 4px; text-transform: uppercase; color: var(--accent); }
  #board .champ .cname { font: calc(84px * var(--hs, 1)) var(--font-head); letter-spacing: 2px; line-height: 1.05; margin: 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #board .champ .cval { font: 900 48px var(--font-text); color: var(--gold); }
  #board .champ .cval small { font-size: 30px; color: var(--panel-text); opacity: .7; margin-left: 8px; }
  #board .champ.nobody { opacity: .55; }
  #board .recap { grid-column: 1 / span 2; display: grid; grid-template-columns: repeat(var(--rcols, 2), minmax(0, 1fr)); gap: 30px 40px; margin-top: 6px; }
  #board .rsec { height: var(--rsh, 418px); box-sizing: border-box; padding: 24px 32px; border-radius: 26px; background: var(--row-bg); border: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); overflow: hidden; }
  #board .rhead { font: calc(var(--rhs, 58px) * var(--hs, 1)) var(--font-head); letter-spacing: 2px; color: var(--accent); margin-bottom: 10px; }
  #board .rhead { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #board .ritem { display: flex; justify-content: space-between; align-items: center; gap: 18px; font: 800 var(--rfs, 36px) var(--font-text); height: var(--rih, 52px); margin: 0; white-space: nowrap; }
  #board .ritem > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #board .ritem small { font-size: 26px; opacity: .7; margin-left: 10px; }
  #board .ritem b { color: var(--gold); }
  #board .ritem i { font-style: normal; }
  #board .ritem .rv { color: var(--gold); font-weight: 900; flex: 0 0 auto; }
  #board .ritem.none { opacity: .55; }
  #board .rfoot { font: 800 26px var(--font-text); opacity: .7; margin-top: 6px; }
  #rankWrap { position: absolute; left: 0; top: 0; width: 1000px; transform-origin: top left; }
  #rankCard { box-sizing: border-box; padding: 34px 40px 26px; border-radius: 36px; background: linear-gradient(160deg, var(--panel-from), var(--panel-to)); border: 6px solid var(--panel-border);
    color: var(--panel-text); box-shadow: 0 20px 50px rgba(0,0,0,.55), 0 0 44px color-mix(in srgb, var(--accent) 35%, transparent); opacity: 0; will-change: transform, opacity; }
  #rankCard .rkhead { display: flex; align-items: center; gap: 28px; }
  #rankCard .rkpic { flex: 0 0 150px; height: 150px; border-radius: 50%; border: 6px solid var(--accent); background: #000 center/cover no-repeat; display: flex; align-items: center; justify-content: center;
    font: 900 70px var(--font-text); color: var(--accent); box-sizing: border-box; }
  #rankCard .rkname { font: calc(80px * var(--hs, 1)) var(--font-head); letter-spacing: 2px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 720px; }
  #rankCard .rksub { font: 900 28px var(--font-text); letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-top: 8px; }
  #rankCard .rkrows { margin-top: 22px; }
  #rankCard .rkrow { display: flex; align-items: center; gap: 22px; height: 100px; padding: 0 26px 0 14px; border-radius: 22px; background: var(--row-bg); margin-bottom: 12px; }
  #rankCard .rkr { flex: 0 0 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 900 30px var(--font-text); background: rgba(255,255,255,.12); }
  #rankCard .rkrow.vip .rkr { background: var(--gold); color: #1a1200; box-shadow: 0 0 16px var(--gold); }
  #rankCard .rkt { flex: 1; min-width: 0; }
  #rankCard .rkt b { display: block; font: 900 28px var(--font-text); letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  #rankCard .rkt span { font: 800 30px var(--font-text); opacity: .85; }
  #rankCard .rks { flex: 0 0 auto; font: 900 28px var(--font-text); text-align: right; max-width: 380px; }
  #rankCard .rks.ok { color: #3ccf6a; }
  #rankCard .rks.qual { color: #9fe8b6; opacity: .85; }
  #rankCard .rkrow.qual .rkr { background: rgba(60,207,106,.22); color: var(--panel-text); }
  #rankCard .rks.no { color: var(--gold); }
  #rankCard .rks.off { opacity: .6; }
  #board .empty { grid-column: 1 / span 2; text-align: center; font: 900 46px var(--font-text); opacity: .8; margin-top: 160px; }
  #status { position: absolute; left: 10px; top: 10px; max-width: 600px; padding: 8px 12px; border-radius: 8px; background: rgba(0,0,0,.75); color: #ffb3b3;
    font: 800 14px var(--font-text); display: none; z-index: 9; }
</style>
</head>
<body>
<div id="stage">
  <div id="stealWrap">
  <div id="flash"></div>
  <div class="who" id="victim"><div class="face"></div><div class="name"></div></div>
  <div id="streaks"></div>
  <div class="who" id="thief"><div class="face"></div><div class="name"></div></div>
  <svg id="badge" viewBox="0 0 64 64"><polygon points="32,4 60,26 32,60 4,26" style="fill: var(--badge)"/>
    <polygon points="32,4 44,26 32,60 20,26" style="fill: var(--badge-shine)"/><polygon points="4,26 60,26 32,60" fill="rgba(0,0,0,.12)"/></svg>
  <div id="banner"><div class="big"></div><div class="small"></div></div>
  </div>
  <canvas id="fxBack" class="fx" width="2560" height="1440"></canvas>
  <div id="boardWrap"><div id="board">
    <div class="bhead"><div class="bphoto"></div><div class="btitles"><div class="bheader"></div><div class="btitle"></div><div class="bsub"></div></div><div class="bdots"></div></div>
    <div class="bcols"></div>
  </div></div>
  <canvas id="fxFront" class="fx" width="2560" height="1440"></canvas>
  <div id="rankWrap"><div id="rankCard"><div class="rkhead"><div class="rkpic"></div><div><div class="rkname"></div><div class="rksub"></div></div></div><div class="rkrows"></div></div></div>
  <div id="status"></div>
</div>
<script>
const CONFIG = {
  host: "127.0.0.1",
  port: 8080,
  endpoint: "/",
  password: "",
  scale: 1,
  showStatus: true,
  steal: {
    animation: "knockout",
    sound: "",
    volume: 80,
    soundAt: "hit",
    message: "{new} stole {old}'s VIP badge!",
    showBanner: true,
    showAmount: true,
    holdSeconds: 4,
    streaks: true,
    flash: true,
    shake: true,
    font: {},
    posX: "centre",
    posY: "middle",
    size: 100,
    colours: {
      loserRing: "#ff6b1a", thiefRing: "#ffffff", nameTag: "#141414", nameTagBorder: "#ff6b1a", nameText: "#ffffff",
      badge: "#ff6b1a", badgeShine: "#ffa055", bannerFrom: "#ff7a1a", bannerTo: "#e8332a", bannerBorder: "#141414",
      bannerWords: "#ffffff", streaks: "#ff9646", flash: "#ffd6aa",
    },
  },
  stats: { CheerBits: {}, SubGifters: {}, SubStreak: {}, WatchStreak: {} },
  boards: {
    show: true,
    order: ["WatchStreak", "SubStreak", "SubGifters", "CheerBits"],
    hidden: [],
    seconds: 8,
    singleSeconds: 12,
    showAnimation: "slide-right",
    showSeconds: 0.65,
    hideAnimation: "fade",
    hideSeconds: 0.45,
    perPage: 10,
    posX: "centre",
    posY: "middle",
    size: 100,
    font: {},
    champions: true,
    championsTitle: "The Champions",
    championsSeconds: 10,
    header: "Top VIPs",
    showPhoto: true,
    photo: "",
    sound: "",
    volume: 70,
    titles: { WatchStreak: "Top Watch Streaks", SubStreak: "Top Sub Streaks", SubGifters: "Top Sub Gifters", CheerBits: "Top Cheerers" },
    colours: {
      panelFrom: "#1d1d1f", panelTo: "#0b0b0c", panelBorder: "#ff6b1a", accent: "#ff6b1a", panelText: "#ffffff",
      rowBg: "rgba(255,255,255,.06)", gold: "#ffc83d", silver: "#d7dde5", bronze: "#d08a4a",
    },
  },
  fonts: { heading: "Bangers", text: "Nunito", headingSize: 100 },
  champs: { title: "The Champions", subtitle: "Number one on every board", seconds: 10 },
  myrank: { show: true, posX: "right", posY: "top", size: 100, seconds: 8, showAnimation: "slide-right", showSeconds: 0.5, hideAnimation: "fade", hideSeconds: 0.4, sound: "", volume: 70 },
  auto: { enabled: false, onlyLive: true, shows: {} },
  recap: { enabled: false, scene: "", delaySeconds: 2, seconds: 20, loop: false, style: "classic", title: "Tonight's Recap", subtitle: "Thanks for hanging out!",
    highlight: "WatchStreak",
    highlightLines: { WatchStreak: "Longest watch streak: {name} ({amount} streams)", SubStreak: "Longest sub streak: {name} ({amount} months)", SubGifters: "Top gifter of all time: {name} ({amount} subs)", CheerBits: "Top cheerer of all time: {name} ({amount} bits)" },
    sections: {
      newVips: { show: true, title: "New VIPs", line: "{name}", empty: "No new VIPs tonight", showStat: true },
      steals: { show: true, title: "Badges stolen", line: "{new} stole {old}'s VIP badge", empty: "No steals tonight", showStat: false, showLost: true, lost: "{count} other VIP badge{s} lost" },
      cheers: { show: true, title: "Top cheerers tonight", line: "{rank}. {name}", value: "{amount} bits", empty: "No bits tonight" },
      gifts: { show: true, title: "Top gifters tonight", line: "{rank}. {name}", value: "{amount} subs", empty: "No gifted subs tonight" },
      lost: { show: false, title: "Lost VIP badges", line: "{name}", empty: "No badges lost tonight", count: 6 },
      watchTop: { show: false, title: "Top watch streaks", line: "{rank}. {name}", value: "{amount} streams", empty: "No watch streaks yet", count: 5 },
      subTop: { show: false, title: "Top sub streaks", line: "{rank}. {name}", value: "{amount} months", empty: "No sub streaks yet", count: 5 },
    } },
  obs: { host: "127.0.0.1", port: 4455, password: "" },
};

const STEAL_VARS = { loserRing: "--loser-ring", thiefRing: "--thief-ring", nameTag: "--name-tag", nameTagBorder: "--name-tag-border", nameText: "--name-text",
  badge: "--badge", badgeShine: "--badge-shine", bannerFrom: "--banner-from", bannerTo: "--banner-to", bannerBorder: "--banner-border",
  bannerWords: "--banner-words", streaks: "--streaks", flash: "--flash" };
const BOARD_VARS = { panelFrom: "--panel-from", panelTo: "--panel-to", panelBorder: "--panel-border", accent: "--accent", panelText: "--panel-text",
  rowBg: "--row-bg", gold: "--gold", silver: "--silver", bronze: "--bronze" };
const UNITS = { WatchStreak: "streams", SubStreak: "months", SubGifters: "subs", CheerBits: "bits" };

const isObj = (v) => v && typeof v === "object" && !Array.isArray(v);
function merge(base, extra) {
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  for (const [k, v] of Object.entries(extra || {})) out[k] = isObj(v) && isObj(base[k]) ? merge(base[k], v) : v;
  return out;
}
const params = new URLSearchParams(location.search);
let cfg = CONFIG;
let badLink = false;
if (params.has("config")) { try { cfg = merge(CONFIG, JSON.parse(params.get("config"))); } catch (e) { badLink = true; } }
if ((params.get("part") || "").includes("%") || (params.get("part") || "").includes("\"")) badLink = true;
for (const k of ["host", "port", "password"]) if (params.has(k)) cfg[k] = k === "port" ? Number(params.get(k)) : params.get(k);
const DEMO = params.get("demo");
if (DEMO || params.has("preview")) document.body.classList.add("preview");
document.getElementById("stage").style.transform = "scale(" + (cfg.scale || 1) + ")";

const $ = (id) => document.getElementById(id);
const queue = [];
let playing = false;
const setVars = (map, values) => { for (const [k, v] of Object.entries(values || {})) if (map[k] && v) document.documentElement.style.setProperty(map[k], v); };
setVars(BOARD_VARS, cfg.boards.colours);
const HEAD_FIT = { "Bangers": 1, "Luckiest Guy": .82, "Bebas Neue": 1.05, "Anton": .9, "Permanent Marker": .82, "Russo One": .78, "Lilita One": .9, "Black Ops One": .8, "Bungee": .72, "Righteous": .85, "Creepster": 1, "Press Start 2P": .5 };
const ASPECTS = ["steal", "boards", "champs", "myrank", "recap"];
const PANEL_KEYS = ["showAnimation", "showSeconds", "hideAnimation", "hideSeconds", "posX", "posY", "size", "header", "showPhoto", "photo", "sound", "volume"];
const fontOf = (name) => merge(cfg.fonts || {}, (cfg[name] || {}).font || {});
function loadFonts() {
  const add = (q) => { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?" + q + "&display=swap"; document.head.appendChild(l); };
  const fam = (n) => "family=" + encodeURIComponent(n).replace(/%20/g, "+");
  const heads = new Set(), texts = new Set();
  for (const a of ASPECTS) { const F = fontOf(a); heads.add(F.heading || "Bangers"); texts.add(F.text || "Nunito"); }
  const BOLD = ["Nunito", "Poppins", "Montserrat", "Rubik", "Fredoka", "Baloo 2", "Oswald", "Roboto", "Comfortaa"];
  for (const f of new Set([...heads, ...texts])) { if (f !== "Bangers" && f !== "Nunito") add(fam(f)); if (texts.has(f) && BOLD.includes(f) && f !== "Nunito") add(fam(f) + ":wght@700"); }
}
function applyFont(F) {
  const headFont = F.heading || "Bangers", textFont = F.text || "Nunito";
  document.documentElement.style.setProperty("--font-head", '"' + headFont + '", "Bangers", "Impact", sans-serif');
  document.documentElement.style.setProperty("--hs", ((HEAD_FIT[headFont] || 1) * Math.max(.3, Math.min(2, (Number(F.headingSize) || 100) / 100))).toFixed(3));
  document.documentElement.style.setProperty("--font-text", '"' + textFont + '", "Nunito", sans-serif');
}
loadFonts();
applyFont(fontOf("boards"));
let A = cfg.boards;
function aspectOf(name) {
  if (name === "boards") return cfg.boards;

  const P = pages[i].ms, local = t - startAt;
  if (i !== shownPage) { shownPage = i; renderPage(i); }
  const first = i === 0, last = i === n - 1, SH = showMs(), HI = hideMs();
  let st = { x: 0, y: 0, s: 1, rot: 0, ry: 0, o: 1 };
  if (first && SH > 0 && local < SH) st = boardAnim(A.showAnimation, part(local, 0, SH), true);
  if (last && local >= P - HI) st = HI > 0 ? boardAnim(A.hideAnimation, 1 - part(local, P - HI, HI), false) : Object.assign(st, { o: 0 });
  if (!first) { const inP = ease.out(part(local, 0, 450)); st.x += lerp(700, 0, inP); st.o *= inP; }
  if (!last) { const outP = ease.in(part(local, P - 450, 450)); st.x += lerp(0, -700, outP); st.o *= 1 - outP; }
  const board = $("board"), styled = pages[i].styled, SS = styled && RECAP_STYLES[styled];
  if (styled) { st = recapAnim(styled, local, P); fxFrame(styled, local, P); } else if (fxOn) fxClear();
  for (const k of Object.keys(RECAP_STYLES)) board.classList.toggle("skin-" + k, styled === k);
  board.style.transformOrigin = SS ? SS.origin : "50% 50%";
  board.style.filter = st.filter || "";
  board.style.opacity = st.o;
  board.style.transform = "perspective(2400px) translate(" + st.x.toFixed(1) + "px," + (st.y + (styled ? 0 : Math.sin(t / 900) * 4 * settle(local))).toFixed(1) + "px) rotateX(" + (st.rx || 0).toFixed(2) + "deg) rotate(" + st.rot.toFixed(2) + "deg) rotateY(" + st.ry.toFixed(2) + "deg) scale(" + st.s.toFixed(4) + "," + (st.s * (st.sy || 1)).toFixed(4) + ")";
  const lead = SS ? SS.intro + SS.in * .6 : first ? Math.max(260, SH * .6) : 260;
  const photo = board.querySelector(".bphoto");
  photo.style.transform = "rotate(" + (Math.sin(t / 700) * 4 * settle(local)).toFixed(2) + "deg) scale(" + (1 + .03 * Math.sin(t / 450) * settle(local)).toFixed(4) + ")";
  const rows = board.querySelectorAll(".row");
  rows.forEach((r, k) => {
    const p = ease.out(part(local, lead + Number(r.dataset.o) * Math.min(45, 1100 / rows.length), 320));
    const lift = r.classList.contains("r1") ? Math.sin(t / 260) * 3 * settle(local) : 0;
    r.style.opacity = p;
    r.style.transform = "translateX(" + lerp(60, 0, p).toFixed(1) + "px) translateY(" + lift.toFixed(1) + "px)";
  });
  board.querySelectorAll(".champ, .rsec").forEach((c, k) => {
    const p = part(local, lead + 40 + k * 260, 420), pop = p < 1 ? ease.out(p) * (1 + .12 * Math.sin(p * Math.PI)) : 1;
    c.style.opacity = Math.min(1, p * 2);
    c.style.transform = "scale(" + pop.toFixed(4) + ")";
    const crown = c.querySelector(".crown");
    if (crown) crown.style.transform = "rotate(" + (-14 + Math.sin(t / 300 + k) * 6 * settle(local)).toFixed(2) + "deg) translateY(" + (Math.sin(t / 400 + k) * 5 * settle(local)).toFixed(1) + "px)";
  });
  return t < total;
}

let playToken = 0;
function stopAll() {
  playToken++;
  lastRecapAt = 0;
  queue.length = 0;
  resetSteal();
  $("board").style.opacity = 0;
  $("rankCard").style.opacity = 0;
  fxClear();
  for (const k of Object.keys(RECAP_STYLES)) $("board").classList.remove("skin-" + k);
  playing = false;
}
function play(item) {
  playing = true;
  const start = performance.now(), mine = ++playToken;
  if (item.type === "steal") {
    placeSteal();
    prepareSteal(item.data);
    const when = { start: 0, hit: IMPACT, land: LAND }[String(eff.soundAt).toLowerCase()] ?? IMPACT;
    let played = false;
    const step = () => {
      if (mine !== playToken) return;
      const t = performance.now() - start;
      if (!played && t >= when) { played = true; playSound(eff.sound, eff.volume); }
      if (stealFrame(t)) requestAnimationFrame(step); else { resetSteal(); playing = false; next(); }
    };
    requestAnimationFrame(step);
  } else if (item.type === "myrank") {
    applyLook("myrank");
    rankTimes = prepareRank(item.data);
    playSound(cfg.myrank.sound, cfg.myrank.volume);
    const step = () => {
      if (mine !== playToken) return;
      if (rankFrame(performance.now() - start)) requestAnimationFrame(step);
      else { $("rankCard").style.opacity = 0; playing = false; next(); }
    };
    requestAnimationFrame(step);
  } else {
    usePanel(item.type === "recap" ? "recap" : item.champs ? "champs" : "boards", item.auto);
    if (item.type === "recap") { pages = recapPages(item.data); recapEnd = false; }
    else {
      pages = withTimes(item.champs ? champsPages(item.boards) : buildPages(item.boards, !item.all));
    }
    shownPage = -1;
    if (!pages.length) { playing = false; next(); return; }
    playSound(A.sound, A.volume);
    const step = () => {
      if (mine !== playToken) return;
      if (item.type === "recap" && pages[0].ms === Infinity && (queue.length || recapEnd)) {
        recapEnd = false;
        pages[0].ms = performance.now() - start + (pages[0].styled ? RECAP_STYLES[pages[0].styled].out : hideMs());
      }
      if (boardsFrame(performance.now() - start)) requestAnimationFrame(step);
      else { $("board").style.opacity = 0; fxClear(); for (const k of Object.keys(RECAP_STYLES)) $("board").classList.remove("skin-" + k); playing = false; next(); }
    };
    requestAnimationFrame(step);
  }
}
function next() { if (!playing && queue.length) play(queue.shift()); }
const PART = String(params.get("part") || "").toLowerCase();
let PARTS = PART ? PART.split(",").map((p) => p.trim()) : ["steals", "leaderboards", "champs", "myrank", "recap", "auto"];
if (PARTS.includes("boards")) PARTS = PARTS.concat(["leaderboards", "champs", "myrank", "auto"]);
if (PART === "boards") PARTS.push("recap");
const has = (p) => PARTS.includes(p);
const isAutoShow = (d) => ("auto" in d ? !!d.auto : !d.demo && Date.now() < autoUntil);
function handle(d) {
  if (!d) return;
  if (d.autoVipSteal && has("steals")) { queue.push({ type: "steal", data: d }); next(); }
  else if (d.autoVipLeaderboards && Array.isArray(d.boards) && (isAutoShow(d) ? has("auto") : has(d.champs ? "champs" : "leaderboards") && (cfg.boards.show || PART))) {
    const auto = isAutoShow(d) ? d.autoShow || takeAutoShow() : "";
    if (isAutoShow(d) && !auto) return;
    if (auto) autoUntil = 0;
    if (queue.filter((q) => q.type === "boards").length >= 2) return;
    queue.push({ type: "boards", boards: d.boards, champs: !!d.champs, demo: !!d.demo, auto, all: d.all !== undefined ? !!d.all : d.boards.length > 1 }); next(); }
  else if (d.autoVipMyRank && has("myrank") && (cfg.myrank.show || d.force)) { if (queue.filter((q) => q.type === "myrank").length < 3) { queue.push({ type: "myrank", data: d }); next(); } }
  else if (d.autoVipRecap && has("recap")) { queue.push({ type: "recap", data: d }); next(); }
}

let socket = null, helloTimer = 0;
function status(text) { const el = $("status"); el.textContent = text || ""; el.style.display = text && cfg.showStatus ? "block" : "none"; }
function send(m) { if (socket && socket.readyState === 1) socket.send(JSON.stringify(m)); }
let sbReady = false, waiting = [];
function ready() {
  send({ request: "Subscribe", id: "autovip-sub", events: { General: ["Custom"] } });
  status(badLink ? "This overlay link is broken (two links pasted together?). Clear the URL box in OBS completely and paste the link from the settings page again." : "");
  sbReady = true;
  waiting.splice(0).forEach(send);
}
async function sha256(text) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return btoa(String.fromCharCode(...new Uint8Array(b))); }
const HOSTS = [...new Set([cfg.host, "127.0.0.1", "localhost"])];
let tryHost = 0;
function connect() {
  const address = "ws://" + HOSTS[tryHost % HOSTS.length] + ":" + cfg.port + (cfg.endpoint || "/");
  let opened = false;
  try { socket = new WebSocket(address); } catch (e) { status("Can't connect to " + address); setTimeout(connect, 5000); return; }
  socket.onopen = () => { opened = true; helloTimer = setTimeout(ready, 1500); };
  socket.onmessage = async (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.op !== undefined && m.d) { clearTimeout(helloTimer); status("Port " + cfg.port + " is OBS's WebSocket, not Streamer.bot's. Use Streamer.bot's WebSocket Server port (usually 8080)."); socket.onclose = null; socket.close(); return; }
    if (m.request === "Hello") {
      clearTimeout(helloTimer);
      if (m.authentication) {
        if (!cfg.password) { status("Streamer.bot wants a password. Add it in the overlay settings."); return; }
        const secret = await sha256(cfg.password + m.authentication.salt);
        send({ request: "Authenticate", id: "autovip-auth", authentication: await sha256(secret + m.authentication.challenge) });
        return;
      }
      ready(); return;
    }
    if (typeof m.id === "string" && m.id.startsWith("autovip-do-")) {
      if (m.status && m.status !== "ok") status("Streamer.bot couldn't run the action '" + (doneNames[m.id] || "") + "'. Re-import AutoVIP so the action exists, and check it's switched on." + (m.error ? " (" + m.error + ")" : ""));
      return;
    }
    if (m.id === "autovip-auth") { if (m.status === "ok") ready(); else status("Streamer.bot said the password is wrong."); return; }
    if (m.event && m.event.source === "General" && m.event.type === "Custom") {
      let d = m.data;
      if (typeof d === "string") { try { d = JSON.parse(d); } catch { return; } }
      if (d && d.data && !d.autoVipSteal && !d.autoVipLeaderboards && !d.autoVipMyRank && !d.autoVipRecap) d = d.data;
      handle(d);
    }
  };
  socket.onclose = () => {
    sbReady = false;
    clearTimeout(helloTimer);
    if (!opened) { tryHost++; if (tryHost % HOSTS.length !== 0) { connect(); return; } }
    status("Can't reach Streamer.bot on port " + cfg.port + " (tried " + HOSTS.join(", ") + "). Is its WebSocket Server started?");
    setTimeout(connect, 5000);
  };
}

const ACTIONS = { topvips: "AutoVIP - Top VIPs (All)", vipchamps: "AutoVIP - VIP Champs", WatchStreak: "AutoVIP - Top Watch Streak", SubStreak: "AutoVIP - Top Sub Streak",
  SubGifters: "AutoVIP - Top Sub Gifters", CheerBits: "AutoVIP - Top Cheer Bits", recap: "AutoVIP - Stream Recap" };
const doneNames = {};
function doAction(name, args) {
  const id = "autovip-do-" + Date.now() + "-" + Math.floor(Math.random() * 1000);
  doneNames[id] = name;
  const m = { request: "DoAction", id, action: { name }, args: args || {} };
  if (sbReady && socket && socket.readyState === 1) send(m); else waiting.push(m);
}
const ONLY_SHOW = String(params.get("show") || "");
function autoShows() {
  const A = cfg.auto || {};
  if (A.shows && Object.keys(A.shows).length) return ONLY_SHOW && A.shows[ONLY_SHOW] ? { [ONLY_SHOW]: A.shows[ONLY_SHOW] } : A.shows;
  return { s1: { on: true, what: A.what || "topvips", minutes: A.minutes || 30, firstMinutes: A.firstMinutes || 10, posX: A.posX || "centre", posY: A.posY || "middle", size: A.size || 100 } };
}
const rotateAt = {};
let autoUntil = 0, autoPending = [], autoLastSent = 0;
function takeAutoShow() {
  autoPending = autoPending.filter((p) => Date.now() - p.at < 20000);
  const p = autoPending.shift();
  return p ? p.id : "";
}
function autoTick(id) {
  const A = cfg.auto || {}, S = autoShows()[id];
  if (!S) return;
  const wait = Math.max(0, autoLastSent + 65000 - Date.now());
  autoLastSent = Date.now() + wait;
  setTimeout(() => {
    let what = S.what || "topvips";
    if (what === "rotate") {
      const list = (cfg.boards.order || []).filter((k) => !(cfg.boards.hidden || []).includes(k)).concat(["vipchamps"]);
      rotateAt[id] = rotateAt[id] || 0;
      what = list[rotateAt[id]++ % list.length];
    }
    autoUntil = Date.now() + 20000;
    autoPending.push({ id, at: Date.now() });
    doAction(ACTIONS[what] || ACTIONS.topvips, { autoVipAuto: "boards", autoVipOnlyLive: A.onlyLive === false ? "false" : "true" });
  }, wait);
}
function startAuto() {
  const A = cfg.auto || {};
  if (!A.enabled) return;
  for (const [id, S] of Object.entries(autoShows())) {
    if (S.on === false) continue;
    const every = Math.max(1, Number(S.minutes) || 30) * 60000, first = Math.max(1, Number(S.firstMinutes) || Number(S.minutes) || 30) * 60000;
    setTimeout(() => { autoTick(id); setInterval(() => autoTick(id), every); }, first);
  }
}
let recapTimer = 0, lastRecapAt = 0;
function onScene(name) {
  const R = cfg.recap || {};
  if (!name) return;
  clearTimeout(recapTimer);
  if (!R.enabled || !R.scene) return;
  if (name.trim().toLowerCase() !== String(R.scene).trim().toLowerCase()) { if (PART === "recap") stopAll(); else recapEnd = true; return; }
  if (Date.now() - lastRecapAt < 10000) return;
  recapTimer = setTimeout(() => { lastRecapAt = Date.now(); doAction(ACTIONS.recap, { autoVipAuto: "recap" }); }, Math.max(0, Number(R.delaySeconds) || 0) * 1000);
}
function connectObs() {
  const O = cfg.obs || {};
  let ws;
  try { ws = new WebSocket("ws://" + (O.host || "127.0.0.1") + ":" + (O.port || 4455)); } catch (e) { return; }
  ws.onmessage = async (e) => {
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.op === 0) {
      const id = { rpcVersion: 1, eventSubscriptions: 4 }, a = m.d && m.d.authentication;
      if (a) id.authentication = await sha256((await sha256((O.password || "") + a.salt)) + a.challenge);
      ws.send(JSON.stringify({ op: 1, d: id }));
    } else if (m.op === 2) ws.send(JSON.stringify({ op: 6, d: { requestType: "GetCurrentProgramScene", requestId: "autovip-scene" } }));
    else if (m.op === 7 && m.d && m.d.requestId === "autovip-scene") onScene(m.d.responseData && (m.d.responseData.currentProgramSceneName || m.d.responseData.sceneName));
    else if (m.op === 5 && m.d && m.d.eventType === "CurrentProgramSceneChanged") onScene(m.d.eventData && m.d.eventData.sceneName);
  };
  ws.onclose = () => setTimeout(connectObs, 10000);
}
function watchScenes() {
  const R = cfg.recap || {};
  if (!R.enabled || !R.scene) return;
  if (window.obsstudio) {
    const checkScene = (onlyHere) => {
      let answered = false;
      try { if (window.obsstudio.getCurrentScene) window.obsstudio.getCurrentScene((sc) => { answered = true; onScene(sc && sc.name); }); } catch (e) {}
      if (onlyHere && PART === "recap") setTimeout(() => { if (!answered) onScene(R.scene); }, 300);
    };
    window.addEventListener("obsSceneChanged", (e) => onScene(e.detail && e.detail.name));
    window.addEventListener("obsSourceActiveChanged", (e) => { if (e.detail && e.detail.active) checkScene(true); else clearTimeout(recapTimer); });
    window.addEventListener("obsSourceVisibleChanged", (e) => { if (e.detail && e.detail.visible) checkScene(false); });
    checkScene(true);
  }
  connectObs();
}

const FAKE_NAMES = ["xan_the_bold", "eve", "LurkLord", "BeardBro", "pixelpanda", "SirChonk", "MossyMug", "toasty", "quietquinn", "NovaNugget", "GritBeard", "LilMeep",
  "captaincouch", "RoboRaccoon", "SnackAttack", "MidnightMoth", "Bramble", "TurboTaco", "ZestyZed", "WaffleWiz"];
const fakeRank = () => ({ autoVipMyRank: true, user: "xan_the_bold", avatar: "", isVip: true, boards: [
  { key: "WatchStreak", unit: "streams", value: 48, rank: 1, topN: 20, vip: true }, { key: "SubStreak", unit: "months", value: 7, rank: 24, topN: 20, vip: false, toGo: 3 },
  { key: "SubGifters", unit: "subs", value: 2, rank: 0, need: 5, topN: 20 }, { key: "CheerBits", unit: "bits", value: 1200, rank: 12, topN: 20, vip: true }] });
const fakeList = (shift, top, n) => Array.from({ length: n }, (_, i) => ({ name: FAKE_NAMES[(i + shift) % FAKE_NAMES.length], value: Math.max(1, Math.round(top * Math.pow(.8, i))) }));
const fakeRecap = () => ({ autoVipRecap: true,
  newVips: FAKE_NAMES.slice(3, 15).map((name, i) => ({ name, cat: ["WatchStreak", "CheerBits", "SubGifters", "SubStreak"][i % 4] })),
  steals: Array.from({ length: 10 }, (_, i) => ({ new: FAKE_NAMES[i], old: FAKE_NAMES[(i + 7) % FAKE_NAMES.length], cat: ["CheerBits", "WatchStreak"][i % 2] })), lost: 3,
  lostNames: FAKE_NAMES.slice(8, 20), watchTop: fakeList(0, 48, 10), subTop: fakeList(5, 36, 10), cheers: fakeList(4, 2500, 10), gifts: fakeList(6, 10, 10),
  streak: { name: "xan_the_bold", value: 48 },
  highlights: { WatchStreak: { name: "xan_the_bold", value: 48 }, SubStreak: { name: "SirChonk", value: 36 }, SubGifters: { name: "MossyMug", value: 120 }, CheerBits: { name: "pixelpanda", value: 25000 } } });
function fakeBoards() {
  const make = (key, title, unit, top, shift) => ({ key, title, unit, rows: Array.from({ length: Math.max(20, Math.min(60, cfg.boards.perPage || 20)) }, (_, i) => ({ rank: i + 1, name: FAKE_NAMES[(i + shift) % FAKE_NAMES.length] + (i >= FAKE_NAMES.length ? Math.floor(i / FAKE_NAMES.length) + 1 : ""), value: Math.max(1, Math.round(top * Math.pow(.86, i))) })) });
  return [make("WatchStreak", "Top Watch Streaks", "streams", 48, 0), make("SubStreak", "Top Sub Streaks", "months", 36, 3), make("SubGifters", "Top Sub Gifters", "subs", 120, 5), make("CheerBits", "Top Bits Cheered", "bits", 25000, 1)];
}
const WHAT = { CheerBits: "2,500 bits cheered", SubGifters: "12 subs gifted", SubStreak: "8-month sub streak", WatchStreak: "14-stream watch streak" };
const fakeSteal = (cat) => ({ autoVipSteal: true, new: "xan_the_bold", old: "eve", newAvatar: "", oldAvatar: "", category: cat, what: WHAT[cat] });

const AT = params.get("at");
if (AT !== null) {
  document.body.classList.add("preview");
  if (params.get("show") === "myrank") { applyLook("myrank"); rankTimes = prepareRank(fakeRank()); rankFrame(Number(AT)); }
  else if (params.get("show") === "recap") { usePanel("recap"); pages = recapPages(fakeRecap()); shownPage = -1; boardsFrame(Number(AT)); }
  else if (params.get("show") === "boards") {
    const only = params.get("board");
    usePanel(only === "champs" ? "champs" : "boards");
    pages = withTimes(only === "champs" ? champsPages(fakeBoards()) : buildPages(only ? fakeBoards().filter((b) => b.key === only) : fakeBoards(), !!only));
    shownPage = -1;
    boardsFrame(Number(AT));
  } else { placeSteal(); prepareSteal(fakeSteal(params.get("cat") || "CheerBits")); stealFrame(Number(AT)); }
} else if (DEMO) {
  if (DEMO === "boards") handle({ autoVipLeaderboards: true, all: true, demo: true, boards: fakeBoards() });
  else if (/^auto(:|$)/.test(DEMO)) {
    const all = autoShows(), id = all[DEMO.slice(5)] ? DEMO.slice(5) : Object.keys(all)[0], w = (all[id] || {}).what || "topvips";
    const single = /^(WatchStreak|SubStreak|SubGifters|CheerBits)$/.test(w);
    handle({ autoVipLeaderboards: true, demo: true, auto: true, autoShow: id, champs: w === "vipchamps", all: !single, boards: single ? fakeBoards().filter((b) => b.key === w) : fakeBoards() });
  }
  else if (DEMO === "champs") handle({ autoVipLeaderboards: true, all: true, champs: true, demo: true, boards: fakeBoards() });
  else if (/^board:/.test(DEMO)) handle({ autoVipLeaderboards: true, all: false, demo: true, boards: fakeBoards().filter((b) => b.key === DEMO.slice(6)) });
  else if (DEMO === "myrank") handle(Object.assign(fakeRank(), { force: true }));
  else if (DEMO === "recap") handle(fakeRecap());
  else if (/^(CheerBits|SubGifters|SubStreak|WatchStreak)$/.test(DEMO)) handle(fakeSteal(DEMO));
  else {
    const cats = ["CheerBits", "SubGifters", "SubStreak", "WatchStreak"];
    let k = 0;
    const loop = () => { if (!playing && !queue.length) { if (k % 5 === 4) handle({ autoVipLeaderboards: true, all: false, demo: true, boards: fakeBoards().slice(0, 1) }); else handle(fakeSteal(cats[k % 5])); k++; } };
    loop(); setInterval(loop, 1000);
  }
} else {
  connect();
  if (has("auto")) startAuto();
  if (has("recap")) watchScenes();
  if (window.obsstudio) window.addEventListener("obsSourceActiveChanged", (e) => { if (e.detail && e.detail.active === false) stopAll(); });
}
